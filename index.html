<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>花精人生劇場 EP01｜千萬不要拜託一個不會拒絕的人</title>
<style>
:root{--paper:#faf7f0;--sage:#718b79;--dark:#293d35;--gold:#bc9862;--line:#d9e0d6}*{box-sizing:border-box}body{margin:0;background:#e9eee7;color:var(--dark);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;line-height:1.85}.wrap{max-width:760px;margin:35px auto;padding:40px clamp(22px,6vw,62px);background:var(--paper);border-radius:24px;box-shadow:0 14px 40px #293d3512}.eyebrow{font-size:.78rem;letter-spacing:.18em;color:#738777;text-align:center}h1{font-family:serif;font-size:clamp(1.8rem,5vw,2.8rem);line-height:1.4;text-align:center;margin:10px 0 14px}h2{font-size:1.45rem;line-height:1.5;margin:12px 0}p{margin:12px 0}.lead{text-align:center;color:#67786c}.rule{height:1px;background:var(--line);margin:28px 0}.scene{background:#fff;border:1px solid #e7e8e0;border-left:5px solid #9eb3a2;border-radius:14px;padding:22px;margin:22px 0}.quote{font-size:1.1rem;font-weight:600}.thought{color:#69766d;font-style:italic}.choices{display:grid;gap:12px;margin:22px 0}.choice{width:100%;text-align:left;cursor:pointer;border:1px solid #c9d5cb;border-radius:13px;background:#fff;color:var(--dark);font:inherit;padding:15px 18px;transition:.15s}.choice:hover,.choice:focus-visible{border-color:#718b79;background:#eff4ed;outline:2px solid transparent;transform:translateY(-1px)}.choice strong{display:block}.choice span{display:block;font-size:.9rem;color:#62746a}.pill{display:inline-block;background:#e8eee7;color:#476252;border-radius:99px;padding:3px 12px;font-size:.82rem}.result{border:1px solid #d5ddcf;background:#fff;border-radius:16px;padding:24px}.result h2{color:#4f725b}.action{border-left:4px solid var(--gold);background:#faf4e8;padding:14px 18px;border-radius:8px;margin-top:18px}.secondary{background:transparent;border:1px solid #9bac9e;border-radius:12px;color:var(--dark);padding:11px 16px;cursor:pointer;font:inherit}.primary{background:var(--sage);color:#fff;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font:inherit}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.small{font-size:.84rem;color:#68776b}.progress{display:flex;gap:8px;justify-content:center;margin:22px 0}.dot{width:9px;height:9px;border-radius:50%;background:#d7dfd5}.dot.active{background:#718b79}footer{text-align:center;margin-top:38px;font-size:.82rem;color:#728073}@media(max-width:600px){.wrap{margin:0;min-height:100vh;border-radius:0;padding:26px 19px}.scene{padding:17px}.choice{padding:14px}}
</style>
</head><body><main class="wrap"><div class="eyebrow">希心之光 · 花精人生劇場</div><h1>千萬不要拜託<br>一個不會拒絕的人</h1><p class="lead">EP01｜有時候，說出口的答案，不是心裡真正的答案。</p><div class="progress" aria-label="故事進度"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div><div id="game" aria-live="polite"></div><footer>這是一場自我覺察的互動故事，不是心理診斷，也不代表花精具有已證實的醫療效果。</footer></main>
<script>
'use strict';
const game=document.getElementById('game');const dots=[...document.querySelectorAll('.dot')];
let response='',motive='',ending='';
const behaviors=[
 {id:'yes',title:'「好啊，交給我！」',sub:'嘴巴比大腦先答應。'},
 {id:'no',title:'「不好意思，我今天真的不行。」',sub:'拒絕了，但心跳突然變快。'},
 {id:'later',title:'「我再看看時間，晚點回你。」',sub:'先拖一點時間，也拖住自己的焦慮。'},
 {id:'boundary',title:'「可以，但我今天只能處理第一部分。」',sub:'試著說清楚自己能做到哪裡。'}
];
const motives=[
 {id:'mimulus',title:'我怕主管不高興。',sub:'萬一影響考績、以後被刁難呢？'},
 {id:'centaury',title:'我不忍心讓人失望。',sub:'他都開口了，我拒絕好像很自私。'},
 {id:'agrimony',title:'我不想把氣氛搞僵。',sub:'笑一笑帶過，至少現在不尷尬。'},
 {id:'rockwater',title:'我覺得自己應該撐得住。',sub:'別人都能做到，我怎麼可以放鬆標準？'}
];
const flowers={
 mimulus:{name:'溝酸漿 Mimulus',headline:'當你擔心的是具體的後果',insight:'你不一定不懂拒絕，而是腦中已經演完主管生氣、考績受影響的連續劇。害怕可能的後果，是可以理解的；但想像的後果不一定會發生。',question:'我真正害怕的是哪一個具體結果？它有多少證據？',action:'下次先問一句：「這件事最晚需要什麼時候完成？」先釐清事實，再決定要不要答應。'},
 centaury:{name:'矢車菊 Centaury',headline:'當別人的需要總是排在你前面',insight:'你可能很會察覺別人的困難，卻很少給自己的疲累同樣的份量。幫忙是選擇，不是義務；善良不需要以委屈自己來證明。',question:'如果我不立刻幫忙，我還能是一個好同事嗎？',action:'下一次有人提出請求，先說：「我確認一下自己的安排，再回覆你。」給自己三分鐘，不立刻答應。'},
 agrimony:{name:'龍芽草 Agrimony',headline:'當你用輕鬆掩蓋心裡的不舒服',insight:'你可能習慣當那個讓場面好看的人。笑容沒有錯，但如果每次都靠笑容把真話吞回去，久了連自己都會聽不見。',question:'我剛才笑著說沒關係，心裡真的沒關係嗎？',action:'練習溫和而清楚地說：「我有點為難，想先確認工作量。」不必板著臉，也能說真話。'},
 rockwater:{name:'岩泉水 Rock Water',headline:'當你對自己的標準比對別人還嚴格',insight:'你可能不是怕別人失望，而是不能接受自己做不到。責任感是力量，但它不必變成永遠不能休息的規定。',question:'如果今天換成我珍惜的朋友，我也會要求他硬撐嗎？',action:'今天刻意保留一段休息時間，並練習說：「這部分明天完成，品質會更好。」'}
};
function setStage(n){dots.forEach((d,i)=>d.classList.toggle('active',i===n-1));window.scrollTo({top:0,behavior:'smooth'})}
function node(tag,cls,content){const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;return e}
function clear(){game.replaceChildren()}
function add(tag,cls,content,parent=game){const e=node(tag,cls,content);parent.append(e);return e}
function choices(items,handler){const area=add('div','choices');items.forEach(o=>{const b=node('button','choice');b.type='button';const t=node('strong','',o.title);const s=node('span','',o.sub);b.append(t,s);b.addEventListener('click',()=>handler(o.id));area.append(b)})}
function stage1(){setStage(1);clear();add('span','pill','第一幕｜星期五下午 5:58');add('h2','','你已經一隻手拿包包，另一隻手準備關電腦。');const s=add('div','scene');add('p','quote','主管：「欸，這份資料星期一要用，你今天可以幫我處理一下嗎？」',s);add('p','thought','你的靈魂已經搭上捷運，你的嘴巴還留在辦公室。',s);add('p','','這一刻，你會怎麼回答？');choices(behaviors,id=>{response=id;stage2()})}
function stage2(){setStage(2);clear();add('span','pill','第二幕｜嘴巴與心裡的不同步');const b=behaviors.find(x=>x.id===response);add('h2','',`你剛才選擇：${b.title}`);const s=add('div','scene');const lines={yes:'主管鬆了一口氣：「太好了！我就知道你最可靠。」你看著螢幕，突然想起今晚原本的安排。',no:'主管愣了一下：「喔……好吧，那我再想辦法。」你走出辦公室，卻忍不住回頭看他的表情。',later:'主管說：「好，那你十分鐘後跟我說。」你得到十分鐘，也得到十分鐘的腦內小劇場。',boundary:'主管皺眉：「只能第一部分？那剩下的怎麼辦？」你發現，說出界線之後，對話才真正開始。'};add('p','',lines[response],s);add('p','thought','如果把剛才的反應往心裡再挖一層……',s);add('h2','','最讓你在意的，其實是哪一件事？');add('p','small','沒有標準答案。選最接近你此刻心情的一個。');choices(motives,id=>{motive=id;stage3()});const tools=add('div','toolbar');const back=node('button','secondary','← 回第一幕');back.onclick=stage1;tools.append(back)}
function stage3(){setStage(3);clear();add('span','pill','第三幕｜這次，換一種說法');add('h2','','如果再給你一次機會，你想試哪一句？');const s=add('div','scene');add('p','','主管還在等你回覆。你發現自己其實可以先問清楚、再決定，而不是立刻做一個完美的好人。',s);const options=[{id:'clarify',title:'「這份資料最晚什麼時候要？我先確認優先順序。」',sub:'先弄清楚需求，不替對方預設答案。'},{id:'limit',title:'「我今天能完成第一部分，其餘明天再處理。」',sub:'讓幫忙有清楚的範圍。'},{id:'decline',title:'「今天我有安排，沒辦法接這件事。」',sub:'直接而有禮貌地拒絕。'}];choices(options,id=>{ending=id;result()});const tools=add('div','toolbar');const back=node('button','secondary','← 回第二幕');back.onclick=stage2;tools.append(back)}
function result(){setStage(3);clear();add('span','pill','故事結局｜一個新的選擇');const outcomes={clarify:'主管翻了翻行事曆：「其實星期一下午才要。那你週一上午給我就好。」你心想：等等，原來我剛剛差點為了不存在的急件取消晚餐？',limit:'主管想了想：「好，我請另一位同事接後半段。」你第一次發現，工作可以被拆分，責任也不必全落在自己身上。',decline:'主管沉默兩秒：「好，那我找別人。」空氣有點尷尬，但世界沒有因此毀滅。你走出辦公室，仍然有一點緊張，也有一點輕鬆。'};add('h2','','主管的反應，和你預想的一樣嗎？');const s=add('div','scene');add('p','',outcomes[ending],s);add('p','thought','你不必每次都選得完美。能發現自己有選擇，已經是新的開始。',s);const f=flowers[motive];const r=add('section','result');add('span','pill','這一次的花精探索線索',r);add('h2','',f.name,r);add('h3','',f.headline,r);add('p','',f.insight,r);add('p','',`問問自己：${f.question}`,r);const a=add('div','action',undefined,r);add('strong','','今天的小行動',a);add('p','',f.action,a);add('p','small','這張卡反映的是你在這段故事中選擇的動機，不代表固定人格，也不是花精處方。',r);const tools=add('div','toolbar');const retry=node('button','primary','再玩一次，看看另一種可能');retry.onclick=()=>{response='';motive='';ending='';stage1()};const back=node('button','secondary','← 回第三幕');back.onclick=stage3;tools.append(retry,back)}
stage1();
</script></body></html>
