<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f5ee"><title>花精人生劇場 EP01｜千萬不要拜託一個不會拒絕的人</title>
<style>
:root{--bg:#f8f6ef;--paper:#fffefa;--ink:#293a32;--sage:#789581;--deep:#476c5c;--line:#d9e1d6;--gold:#b59b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.85}main{max-width:760px;margin:0 auto;padding:32px 18px 80px}.eyebrow{font-size:.8rem;letter-spacing:.22em;color:var(--deep);font-weight:700}.hero{text-align:center;padding:38px 16px 30px}.flower{font-size:2rem;color:var(--sage)}h1{font-family:Georgia,"Noto Serif TC",serif;font-size:clamp(1.8rem,5vw,2.75rem);line-height:1.45;margin:14px 0}h2{font-size:1.5rem;margin:0 0 14px}p{margin:12px 0}.sub{color:#64766b}.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,5vw,38px);box-shadow:0 12px 34px #334c3710}.scene{background:#f0f3ec;border-left:4px solid #91a994;border-radius:12px;padding:18px 22px;margin:24px 0;white-space:pre-line}.choices{display:grid;gap:12px;margin:25px 0}.choice{width:100%;text-align:left;background:#fff;border:1px solid #cddbcf;border-radius:14px;padding:16px 18px;font:inherit;color:var(--ink);cursor:pointer;transition:.15s}.choice:hover,.choice:focus-visible{border-color:var(--deep);background:#f1f6ef;outline:2px solid transparent;transform:translateY(-1px)}.choice strong{color:var(--deep)}.choice small{display:block;color:#64766b;font-size:.88rem;margin-top:4px}.primary,.secondary{font:inherit;cursor:pointer;border-radius:999px;padding:12px 24px;font-weight:700}.primary{background:var(--deep);color:white;border:1px solid var(--deep)}.secondary{background:transparent;color:var(--deep);border:1px solid #aabfac}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.progress{display:flex;gap:8px;justify-content:center;margin-bottom:26px}.dot{height:7px;width:42px;border-radius:8px;background:#dbe4d9}.dot.active{background:var(--sage)}.tag{display:inline-block;background:#eaf1e8;color:var(--deep);padding:4px 12px;border-radius:30px;font-size:.8rem;font-weight:700}.result{border-top:1px solid var(--line);padding-top:22px;margin-top:22px}.quote{font-family:Georgia,"Noto Serif TC",serif;font-size:1.22rem;color:var(--deep)}footer{text-align:center;color:#78867c;font-size:.8rem;padding:24px 0}button:focus-visible{outline:3px solid #b99d67;outline-offset:3px}[hidden]{display:none!important}@media(max-width:480px){main{padding:12px 12px 60px}.hero{padding:22px 8px}.panel{border-radius:16px}.actions button{width:100%}}
</style>
</head>
<body><main><header class="hero"><div class="flower" aria-hidden="true">✿</div><div class="eyebrow">希心之光 · 花精人生劇場</div><h1>千萬不要拜託<br>一個不會拒絕的人</h1><p class="sub">EP01｜人生這齣戲，這次換你選劇本。</p></header>
<section class="panel" aria-live="polite"><div class="progress" aria-label="遊戲進度"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div><div id="game"></div></section><footer>這是一場自我觀察的互動故事，不是心理診斷或醫療建議。<br>© 花精人生劇場</footer></main>
<script>
(function(){'use strict';
const game=document.getElementById('game');const dots=[...document.querySelectorAll('.dot')];let state={path:null,second:null};
const routes={
centaury:{name:'Centaury｜矢車菊',label:'習慣先答應，再委屈自己',inner:'我其實不想做，但拒絕會不會讓對方失望？',boss:'「太好了！我就知道找你準沒錯。」主管轉身就走，連你今天有沒有安排都沒問。',insight:'你很會照顧別人的需要，卻可能把自己的時間放到最後。',question:'當你說「沒問題」時，心裡真的也覺得沒問題嗎？',action:'今天遇到一個請求，先說：「我確認一下手上的安排，十分鐘後回覆你。」練習給自己一點思考空間。'},
rock:{name:'Rock Water｜岩泉水',label:'用高標準要求自己',inner:'答應了就應該做好。不能因為累就放低標準。',boss:'「那就麻煩你了。」主管離開後，你開始替每個細節安排檢查清單，連原本不需要的部分也加進去。',insight:'認真是你的力量，但當規則變得太硬，休息也可能被你當成一種失職。',question:'如果今天只做到「夠好」，你最怕發生什麼？',action:'挑一件低風險的小事，允許自己做到八十分就停下來，觀察心裡出現的聲音。'},
agrimony:{name:'Agrimony｜龍芽草',label:'用笑容藏起不舒服',inner:'算了，別把氣氛弄僵。笑一下就過去了。',boss:'「你人真好！」主管笑著走開。你也跟著笑，直到辦公室只剩下你一個人。',insight:'你善於讓氣氛輕鬆，但有時候，笑容也會讓真正的感受沒地方站。',question:'你說「沒事啦」的時候，最希望別人不要發現什麼？',action:'今天找一個安全的時刻，把「沒事」換成一句更真實的話，例如：「其實我有點累，想休息一下。」'},
scleranthus:{name:'Scleranthus｜線球草',label:'在兩個答案之間反覆拉扯',inner:'拒絕好像不太好，答應又很累……到底怎麼選？',boss:'「所以可以嗎？」主管又問一次。你還在權衡每一種可能，時間卻一分一秒過去。',insight:'你能看見不同選擇的代價，但過度比較可能讓自己的需要愈來愈模糊。',question:'如果不用找出最完美的答案，你現在比較想選哪一個？',action:'為一個小決定設定兩分鐘期限，寫下最重要的一個判斷標準，時間到就選擇。'}
};
function el(tag,txt,cls){const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}
function clear(stage){game.replaceChildren();dots.forEach((d,i)=>d.classList.toggle('active',i<=stage))}
function para(txt,cls){game.appendChild(el('p',txt,cls))}
function scene(txt){game.appendChild(el('div',txt,'scene'))}
function choices(items,cb){const wrap=el('div',undefined,'choices');items.forEach((it,i)=>{const b=el('button',undefined,'choice');b.type='button';b.appendChild(el('strong',String.fromCharCode(65+i)+'. '+it.title));if(it.note)b.appendChild(el('small',it.note));b.addEventListener('click',()=>cb(it));wrap.appendChild(b)});game.appendChild(wrap)}
function buttons(items){const wrap=el('div',undefined,'actions');items.forEach(it=>{const b=el('button',it.title,it.secondary?'secondary':'primary');b.type='button';b.addEventListener('click',it.fn);wrap.appendChild(b)});game.appendChild(wrap)}
function start(){state={path:null,second:null};clear(0);game.appendChild(el('span','第一幕｜下班前兩分鐘','tag'));game.appendChild(el('h2','星期五，下午 5:58。'));para('你已經一隻手拿包包，另一隻手準備關電腦。');scene('主管突然探出頭：\n「欸，這份資料星期一要用，你今天可以幫我處理一下嗎？」\n\n你的靈魂已經搭上捷運，你的嘴巴還留在辦公室。');para('這次，你會怎麼回答？');choices([{id:'centaury',title:'好啊，交給我。',note:'其實心裡很不想。'},{id:'rock',title:'我應該做得完。',note:'不能讓自己偷懶。'},{id:'agrimony',title:'哈哈，沒問題啦！',note:'笑著把不舒服藏起來。'},{id:'scleranthus',title:'呃……我想一下。',note:'答應和拒絕都很難。'}],it=>{state.path=it.id;second()})}
function second(){clear(1);const r=routes[state.path];game.appendChild(el('span','第二幕｜嘴巴和心裡不同步','tag'));game.appendChild(el('h2','話已經說出口了。'));scene(r.boss);para('你心裡冒出一句話：');para('「'+r.inner+'」','quote');para('接下來，你想怎麼做？');choices([{id:'repeat',title:'算了，照原本的方式繼續。',note:'熟悉的反應最省力。'},{id:'pause',title:'等一下，我想重新說清楚。',note:'給自己一次調整的機會。'}],it=>{state.second=it.id;third()});buttons([{title:'← 回第一幕',secondary:true,fn:start}])}
function third(){clear(2);const r=routes[state.path];game.appendChild(el('span','第三幕｜你可以改寫台詞','tag'));game.appendChild(el('h2',state.second==='pause'?'這次，你決定說真話。':'你照著熟悉的方式走下去。'));scene(state.second==='pause'?'你叫住主管：「我剛才回答得太快了。我需要先確認今天能完成多少，明天再跟你說明安排。」\n\n主管愣了一秒。世界沒有因此爆炸。':'你留下來處理工作。晚上八點，辦公室的燈還亮著。\n\n你突然想到：原來我不是沒有選擇，只是太習慣用同一種方式回答。');para('不管剛才選哪一條路，這都不是一張「你就是這種人」的標籤。它只是一次觀察。');const box=el('div',undefined,'result');box.appendChild(el('span','花精探索卡','tag'));box.appendChild(el('h2',r.name));box.appendChild(el('p',r.label,'quote'));box.appendChild(el('p',r.insight));box.appendChild(el('h3','問問自己'));box.appendChild(el('p',r.question));box.appendChild(el('h3','今天的小行動'));box.appendChild(el('p',r.action));game.appendChild(box);buttons([{title:'再玩一次，看看另一種反應',fn:start},{title:'複製我的探索卡',secondary:true,fn:()=>{const t='花精人生劇場 EP01\n'+r.name+'\n'+r.insight+'\n問問自己：'+r.question+'\n今天的小行動：'+r.action;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>alert('探索卡已複製！')).catch(()=>window.prompt('請複製以下內容：',t))}else window.prompt('請複製以下內容：',t)}}])}
start();
})();
</script></body></html>
